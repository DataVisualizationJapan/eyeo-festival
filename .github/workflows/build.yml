name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Hugo
        env:
          HUGO_VERSION: '0.152.0'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check source inventory and build
        run: |
          python3 scripts/test_ingestion.py
          python3 scripts/validate.py --without-sources
          hugo --minify --baseURL https://example.org/eyeo-test/ --destination "$RUNNER_TEMP/eyeo-public"
          python3 scripts/check_output.py "$RUNNER_TEMP/eyeo-public" --base-path /eyeo-test/
